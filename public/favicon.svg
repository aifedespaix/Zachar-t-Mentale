<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Chemin en Z. Les marges sont repoussées à 16px du bord (Safe Area) -->
  <polyline 
    points="36,36 92,36 36,92 92,92"
    fill="none"
    stroke="#64748B"
    stroke-width="12"
    stroke-linejoin="round"
    stroke-linecap="round" 
  />

  <!-- 1. Rouge (Titre) : Haut Gauche -->
  <circle cx="36" cy="36" r="20" fill="#EF4444" />

  <!-- 2. Orange (Sous-titre) : Haut Droite -->
  <circle cx="92" cy="36" r="20" fill="#F97316" />

  <!-- 3. Bleu (Sous-partie) : Bas Gauche -->
  <circle cx="36" cy="92" r="20" fill="#3B82F6" />

  <!-- 4. Jaune (Info) : Bas Droite -->
  <circle cx="92" cy="92" r="20" fill="#EAB308" />
</svg>
